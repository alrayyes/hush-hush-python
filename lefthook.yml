# The same commands CI runs, so the two cannot drift. The hook catches it
# early; CI is the gate that cannot be skipped.

pre-commit:
  jobs:
    - name: ruff-format
      glob: "*.py"
      # --force-exclude: ruff's config-based `extend-exclude` (used here to
      # skip src/hush_hush/_generated) is otherwise ignored for files named
      # explicitly on the command line, which {staged_files} always does.
      run: uv run ruff format --force-exclude {staged_files}
      stage_fixed: true

    - name: ruff-check
      glob: "*.py"
      run: uv run ruff check --fix --force-exclude {staged_files}
      stage_fixed: true

    - name: prettier
      glob: "*.{md,yml,yaml}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true

    - name: markdownlint
      glob: "*.md"
      run: bunx markdownlint-cli2 {staged_files}

    - name: vale
      glob: "*.md"
      run: ./scripts/lint-vale.sh

    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

    - name: pyproject-fmt
      glob: "pyproject.toml"
      run: uvx pyproject-fmt@2.29.3 --keep-full-version {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: test
      run: uv run pytest

    - name: ruff
      run: uv run ruff check .

    - name: pip-audit
      run: uv run pip-audit

    - name: pyproject-fmt
      run: uvx pyproject-fmt@2.29.3 --keep-full-version --check pyproject.toml

    - name: prettier
      run: bun run format:check

    - name: markdownlint
      run: bun run lint:md

    - name: vale
      run: ./scripts/lint-vale.sh

    - name: ltex
      run: ./scripts/lint-ltex.sh
