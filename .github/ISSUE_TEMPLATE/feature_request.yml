name: Feature request
description: New capability or request for this SDK
labels: ["kind/feature"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "As a ‹who›, I want ‹what›, so that ‹why›."
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Given/When/Then, 3-5 testable rules.
    validations:
      required: true
  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of done
      description: What has to be true for this to ship.
    validations:
      required: true
