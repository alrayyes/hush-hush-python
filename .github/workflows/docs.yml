# Builds the API reference from docstrings and publishes it to GitHub
# Pages. Separate from ci.yml's own jobs since this deploys something
# (a live site), not just checks a diff.
#
# Also runs on pull_request (build only, deploy stays push-to-main-only) so a
# change that breaks mkdocs fails its own checks instead of only failing the
# push to main after it has merged. hush-hush-php does the same.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.7"
      - run: uv sync --all-extras --group docs
      - run: uv run --group docs mkdocs build --strict
      # A Pages deploy replaces the whole site, so the test and coverage
      # reports ship from this job on every push to main. Running pytest
      # here, not downloading ci.yml's results, keeps the two workflows
      # independent; a red run fails the build and so publishes nothing.
      - name: Test and coverage reports
        if: github.event_name == 'push'
        run: |
          uv run pytest --cov=hush_hush --cov-report= --junitxml=junit.xml
          uv run coverage xml -o coverage.xml
          uv run coverage lcov -o lcov.info
          uv run coverage html -d htmlcov
          mkdir -p site/reports/tests site/reports/coverage
          cp junit.xml site/reports/tests/junit.xml
          cp -r htmlcov/. site/reports/coverage/
          cp coverage.xml lcov.info site/reports/coverage/
          cp scripts/reports-index.html site/reports/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # The deploy succeeds even when the site it serves 404s, so fetch the
      # real file. The retries cover the CDN catching up.
      - name: Check the live coverage report
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 \
            --retry-all-errors --output coverage.xml \
            "${PAGE_URL%/}/reports/coverage/coverage.xml"
          grep -q '<coverage ' coverage.xml
