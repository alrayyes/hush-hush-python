# The gate. Every command in here has a twin in lefthook.yml, so a green
# pre-commit means a green pipeline and neither can drift into being the only
# place a rule is enforced.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.7"

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uvx pyproject-fmt@2.29.3 --keep-full-version --check pyproject.toml

  # Fails only on advisories this change adds over its base (rules/dependencies.md).
  # What is already on main is the scan's to track, in advisory-scan.yml. The check
  # always reports so it can stay required; its steps run only when a pull request
  # changes the manifest or lockfile, and always on a push to main.
  pip-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: deps
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ] || git diff --name-only "$BASE" HEAD | grep -qE '^(pyproject\.toml|uv\.lock|\.github/workflows/ci\.yml)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.deps.outputs.run == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      # Pinned to a main commit of alrayyes/advisory-scan until its first release; re-pin then.
      - if: steps.deps.outputs.run == 'true'
        uses: alrayyes/advisory-scan@425418a63e80eb10142fbd2e82127b7ef3a51d68
        with:
          mode: gate
          setup: uv sync --frozen --all-extras
          command: uv run pip-audit

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-extras
      - name: pytest (hand-written layer only; see design.md's testing layers)
        run: uv run pytest --cov=hush_hush --cov-report=term-missing --cov-report=xml --junitxml=junit.xml
      # The reports ship from the pages job on a push to main, so they are
      # assembled on every run: a broken step fails here, before the merge.
      - name: Assemble the test and coverage reports
        run: |
          uv run coverage lcov -o lcov.info
          uv run coverage html -d htmlcov
          mkdir -p reports/tests reports/coverage
          cp junit.xml reports/tests/junit.xml
          cp -r htmlcov/. reports/coverage/
          cp coverage.xml lcov.info reports/coverage/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: reports
          if-no-files-found: error
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # A Dependabot PR doesn't get repo secrets by default (GitHub's
          # own restriction, not a misconfiguration here) - CODECOV_TOKEN
          # is empty on that run, and this repo's branch protection makes
          # Codecov refuse a tokenless upload ("Token required because
          # branch is protected"). That's an upload hiccup on an
          # unprivileged run, not a real test regression - true here
          # would fail every Dependabot PR's CI on that basis alone
          # (confirmed on the sibling hush-hush-php repo's PRs #13/#14,
          # where the tests themselves passed clean).
          fail_ci_if_error: false

      # Codecov Test Analytics: per-test failure/flake detail, not just a
      # coverage delta. !cancelled(), not always() - still runs when pytest
      # above failed (junit.xml exists either way), but not if the whole run
      # was cancelled out from under it. Same Dependabot-token gap as above.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv build

  # Proves the generated client wasn't hand-edited: regenerating from the
  # pinned submodule commit must produce a byte-identical tree. See
  # design.md's "Generated/hand-written boundary" decision.
  codegen-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-extras
      - run: ./scripts/generate.sh
      - run: git diff --exit-code src/hush_hush/_generated

  markdown:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        run: bun install --frozen-lockfile
      - name: prettier --check
        run: bun run format:check
      - name: markdownlint
        run: bun run lint:md

  # Mechanics: grammar, spelling, the phonetic article. A right answer, so
  # this one gates rather than advises.
  grammar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/alrayyes/ltex-cli-plus:18.7.0@sha256:22452e86a130e528d526b60792926002983fcbf732bff09bd4e843d22816e4ea
      options: --entrypoint ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/lint-ltex.sh

  # Style: house voice, weasel words, corporate speak. Advice rather than a
  # verdict - MinAlertLevel in .vale.ini prints it, and only Vale.Terms
  # takes the job down.
  style:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/lint-vale.sh

  # Contract-test the client against a mock server built from the same pinned
  # spec, per rules/sdk-generation.md's "testing against the spec, not a
  # hand-written stub".
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-extras
      - name: Start Prism mock from the pinned spec
        run: |
          docker run -d --name prism -p 4010:4010 \
            -v "$(pwd)/hush-hush/api:/spec:ro" \
            stoplight/prism:5@sha256:3f6d29e31bfe0b99587f0f6f79c423858dd6a2ea7e1e4658273ed930a78a9acf mock -h 0.0.0.0 -m false /spec/openapi.yaml
          # -m false: Prism's default multiprocess (Node cluster) mode
          # crashes on startup in this image — see hush-hush-go's CLAUDE.md
          # for the reproduction.
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4010 >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Run contract tests against the mock
        run: uv run pytest tests/contract -m contract
        env:
          HUSH_HUSH_BASE_URL: http://localhost:4010
      - name: Prism logs
        if: failure()
        run: docker logs prism

  # Records the client's real interactions as a Pact consumer contract.
  # Provider verification against hush-hush's actual server has to run in
  # hush-hush's own CI (see design.md's Risks — an external dependency this
  # repo can't wire up unilaterally); this job's job is only to keep
  # producing an up-to-date pact file for that to consume.
  pact-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-extras
      - run: uv run pytest tests/pact -m pact
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hush-hush-python-pact
          path: pact/pacts/*.json

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: commitlint
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

  # One site, one Pages deployment: a second deploy replaces the first, so the
  # docs and the reports ship together. Assembled on every run so a broken
  # mkdocs build or report fails a pull request; only the deploy below is
  # limited to main. Needs every other job, so a red run publishes nothing.
  pages:
    needs:
      - actionlint
      - lint
      - pip-audit
      - test
      - build
      - codegen-drift
      - markdown
      - grammar
      - style
      - contract
      - pact-consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --all-extras --group docs
      # The docs stay at the site root, where they have always been served.
      - run: uv run --group docs mkdocs build --strict
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reports
          path: site/reports
      - run: cp scripts/reports-index.html site/reports/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push'
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # The deploy succeeds even when the site it serves 404s, so fetch the
      # real file. The retries cover the CDN catching up.
      - name: Check the live coverage report
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 \
            --retry-all-errors --output coverage.xml \
            "${PAGE_URL%/}/reports/coverage/coverage.xml"
          grep -q '<coverage ' coverage.xml
