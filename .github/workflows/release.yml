# Nobody picks a version by hand for hand-written-code changes:
# release-please reads Conventional Commits on main and keeps a release pull
# request open with the next version and changelog entry. For a
# regeneration pull request specifically, the commit message's bump marker
# is set by codegen.yml from the openapi-diff classification, not written by
# a person — see design.md's "Versioning via spec diff" decision.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_TOKEN }}

  # Publishes the tagged release to PyPI via Trusted Publishing (OIDC) — no
  # API token held as a repo secret, per releases.md's provenance section.
  # gh-action-pypi-publish attaches a PyPI attestation to the artifact by
  # default whenever it runs with id-token: write, so this also covers that
  # section's "native provenance" recommendation with no extra step.
  # Reverses openspec/design.md's former "publish is deliberately manual"
  # Non-Goal — see issue #21.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/hush-hush/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
