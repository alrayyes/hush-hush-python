# Nobody picks a version by hand for hand-written-code changes:
# release-please reads Conventional Commits on main and keeps a release pull
# request open with the next version and changelog entry. For a
# regeneration pull request specifically, the commit message's bump marker
# is set by codegen.yml from the openapi-diff classification, not written by
# a person — see design.md's "Versioning via spec diff" decision.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    # wretry.action repackages the wrapped action's own outputs into one
    # JSON blob at steps.release.outputs.outputs, rather than passing each
    # one through under its own name - fromJSON unpacks it back out.
    outputs:
      release_created: ${{ fromJSON(steps.release.outputs.outputs).release_created }}
      tag_name: ${{ fromJSON(steps.release.outputs.outputs).tag_name }}
    steps:
      # release-please-action is a `uses:` step, so nick-fields/retry (which
      # only runs a shell command) can't wrap it directly — wretry.action
      # wraps another action's own uses:/with: instead. Retries a secondary
      # GitHub API rate limit / abuse-detection response, which clears
      # itself within seconds and has nothing to do with the token's hourly
      # quota genuinely running out (rules/releases.md's "Retry a release
      # job through GitHub's transient rate limit").
      - uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        id: release
        with:
          action: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
          with: |
            config-file: release-please-config.json
            manifest-file: .release-please-manifest.json
            token: ${{ secrets.RELEASE_TOKEN }}
          attempt_limit: 3
          attempt_delay: 30000

  # Publishes the tagged release to PyPI via Trusted Publishing (OIDC) — no
  # API token held as a repo secret, per releases.md's provenance section.
  # gh-action-pypi-publish attaches a PyPI attestation to the artifact by
  # default whenever it runs with id-token: write, so this also covers that
  # section's "native provenance" recommendation with no extra step.
  # Reverses openspec/design.md's former "publish is deliberately manual"
  # Non-Goal — see issue #21.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/hush-hush/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.7"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
